<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Petite Côte Immo</title>
  
  <!-- FontAwesome pour les icônes professionnelles -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Overlay / Fond sombre de la modale */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      z-index: 1000;
    }

    /* Boîte de dialogue originale avec ton design */
    .modal-card {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      border-radius: 20px;
      padding: 28px 24px;
      position: relative;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      max-height: 90vh;
      overflow-y: auto;
    }

    /* Bouton fermer X */
    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 22px;
      color: #94a3b8;
      cursor: pointer;
      font-weight: bold;
    }

    /* Titre principal */
    .modal-card h2 {
      font-size: 22px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 20px;
    }

    /* Structure des champs avec icône devant */
    .input-group {
      position: relative;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 16px;
      color: #94a3b8;
      font-size: 16px;
      z-index: 2;
      pointer-events: none;
    }

    .input-group input, 
    .input-group textarea {
      width: 100%;
      padding: 14px 14px 14px 46px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      font-size: 15px;
      color: #334155;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input::placeholder, 
    .input-group textarea::placeholder {
      color: #94a3b8;
    }

    .input-group input:focus, 
    .input-group textarea:focus {
      border-color: #f59e0b;
    }

    .input-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    /* Label personnalisé pour l'upload de fichiers */
    .file-upload-label {
      width: 100%;
      padding: 14px 14px 14px 46px;
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
      background-color: #f8fafc;
      color: #94a3b8;
      cursor: pointer;
      font-size: 15px;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background-color 0.2s;
    }

    .file-upload-label:hover {
      background-color: #f1f5f9;
    }

    /* Bouton d'action orange original */
    .submit-btn {
      width: 100%;
      background-color: #f59e0b;
      color: #ffffff;
      font-weight: 700;
      border: none;
      padding: 15px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 17px;
      margin-top: 8px;
      transition: background-color 0.2s;
    }

    .submit-btn:hover {
      background-color: #d97706;
    }

    /* Section des interactions style Réseaux Sociaux */
    .social-section {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #f1f5f9;
    }

    .social-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748b;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .social-bar {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: #f8fafc;
      padding: 10px;
      border-radius: 12px;
    }

    .social-btn {
      background: none;
      border: none;
      color: #64748b;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 8px;
      transition: background-color 0.2s, color 0.2s;
    }

    .social-btn:hover {
      background-color: #e2e8f0;
      color: #1e293b;
    }

    .social-btn.liked {
      color: #ef4444;
    }

    .social-btn.liked i {
      font-weight: 900;
    }
  </style>
</head>
<body>

  <!-- MODALE PRINCIPALE -->
  <div class="modal-overlay">
    <div class="modal-card">
      <span class="close-btn">&times;</span>
      <h2>Publier un terrain</h2>
      
      <form id="publishForm">
        <!-- Champ Fichier (Image / Vidéo local) -->
        <div class="input-group">
          <i class="fas fa-camera input-icon"></i>
          <input type="file" id="mediaFile" accept="image/*,video/*" required style="display: none;" onchange="handleFileSelect(this)">
          <label for="mediaFile" class="file-upload-label" id="fileLabel">
            Choisir une image ou vidéo...
          </label>
        </div>

        <!-- Superficie -->
        <div class="input-group">
          <i class="fas fa-ruler-combined input-icon"></i>
          <input type="number" placeholder="Superficie (m²)" required>
        </div>

        <!-- Localisation -->
        <div class="input-group">
          <i class="fas fa-map-marker-alt input-icon"></i>
          <input type="text" placeholder="Localisation (ex: Somone)" required>
        </div>

        <!-- Prix -->
        <div class="input-group">
          <i class="fas fa-tag input-icon"></i>
          <input type="number" placeholder="Prix (FCFA)" required>
        </div>

        <!-- Numéro WhatsApp -->
        <div class="input-group">
          <i class="fab fa-whatsapp input-icon"></i>
          <input type="tel" placeholder="Numéro WhatsApp (ex: 221770000000)" required>
        </div>

        <!-- Nouveau champ : Détails du terrain -->
        <div class="input-group">
          <i class="fas fa-align-left input-icon"></i>
          <textarea rows="3" placeholder="Détails du terrain (ex: Titre foncier, accès eau/électricité, terrain d'angle...)" required></textarea>
        </div>

        <button type="submit" class="submit-btn">Publier</button>
      </form>

      <!-- EXEMPLE DE BARRE DE SOCIAL FEED (Boutons Aimer, Commenter, Partager) -->
      <div class="social-section">
        <div class="social-title">Aperçu interactions visiteurs</div>
        <div class="social-bar">
          <button class="social-btn" id="likeBtn" onclick="toggleLike()">
            <i class="far fa-heart"></i>
            <span id="likeCount">0</span>
          </button>

          <button class="social-btn" onclick="openComments()">
            <i class="far fa-comment"></i>
            <span>Commenter</span>
          </button>

          <button class="social-btn" onclick="sharePost()">
            <i class="fas fa-share"></i>
            <span>Partager</span>
          </button>
        </div>
      </div>

    </div>
  </div>

  <script>
    // Affichage du nom du fichier sélectionné dans le label
    function handleFileSelect(input) {
      const label = document.getElementById('fileLabel');
      if (input.files && input.files[0]) {
        label.innerText = input.files[0].name;
        label.style.color = '#1e293b';
      } else {
        label.innerText = 'Choisir une image ou vidéo...';
        label.style.color = '#94a3b8';
      }
    }

    // Gestion du Like (Bouton Cœur)
    let isLiked = false;
    let likes = 0;

    function toggleLike() {
      const likeBtn = document.getElementById('likeBtn');
      const likeCount = document.getElementById('likeCount');
      const icon = likeBtn.querySelector('i');

      isLiked = !isLiked;
      if (isLiked) {
        likes++;
        likeBtn.classList.add('liked');
        icon.classList.replace('far', 'fas');
      } else {
        likes--;
        likeBtn.classList.remove('liked');
        icon.classList.replace('fas', 'far');
      }
      likeCount.innerText = likes;
    }

    // Gestion de la fonction Partager
    function sharePost() {
      if (navigator.share) {
        navigator.share({
          title: 'Petite Côte Immo',
          text: 'Découvrez ce terrain sur Petite Côte Immo !',
          url: window.location.href,
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert("Lien de l'annonce copié dans le presse-papier !");
      }
    }

    // Simulation section commentaire
    function openComments() {
      const comment = prompt("Écrivez votre commentaire :");
      if (comment) {
        alert("Commentaire ajouté avec succès !");
      }
    }

    // Soumission du formulaire
    document.getElementById('publishForm').addEventListener('submit', function(e) {
      e.preventDefault();
      alert("Annonce publiée avec succès !");
    });
  </script>
</body>
</html>
