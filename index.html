<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Petite Côte Immo - Vente & Achat de Terrains</title>
  <style>
    /* RESET & BASE STYLES */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    :root {
      --primary-color: #0d6efd;
      --primary-hover: #0b5ed7;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #212529;
      --text-muted: #6c757d;
      --border-color: #e0e0e0;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
      --radius: 12px;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      padding-bottom: 40px;
    }

    /* HEADER & NAV */
    header {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      color: white;
      padding: 20px 15px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    nav {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    nav h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .nav-actions {
      display: flex;
      gap: 10px;
    }

    .btn-nav {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    .btn-nav:hover {
      background: white;
      color: #1e3c72;
    }

    .hero-banner {
      max-width: 800px;
      margin: 25px auto 10px;
      padding: 0 15px;
    }

    .hero-banner h2 {
      font-size: 1.6rem;
      margin-bottom: 8px;
    }

    .hero-banner p {
      font-size: 1rem;
      opacity: 0.9;
    }

    /* MAIN LAYOUT */
    main {
      max-width: 800px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .section-title {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: #1e3c72;
      border-left: 4px solid var(--primary-color);
      padding-left: 10px;
    }

    /* PUBLISH FORM CARD */
    .publish-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 35px;
      border: 1px solid var(--border-color);
    }

    .publish-card h3 {
      margin-bottom: 15px;
      color: #1e3c72;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-control {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      border-color: var(--primary-color);
    }

    textarea.form-control {
      resize: vertical;
      min-height: 80px;
    }

    /* MEDIA UPLOADER BUTTONS */
    .media-buttons {
      display: flex;
      gap: 12px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .btn-media {
      flex: 1;
      min-width: 140px;
      background: #f0f2f5;
      border: 1px dashed #a0a0a0;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      font-weight: 600;
      color: #444;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-media:hover {
      background: #e4e6eb;
      border-color: var(--primary-color);
      color: var(--primary-color);
    }

    /* PREVIEW CONTAINER */
    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 10px;
      margin-bottom: 15px;
    }

    .preview-item {
      position: relative;
      width: 100%;
      height: 100px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .preview-item img,
    .preview-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .btn-submit {
      width: 100%;
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background: var(--primary-hover);
    }

    /* TERRAIN CARDS FEED */
    .terrain-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 25px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .card-header {
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #f0f0f0;
    }

    .card-header h4 {
      font-size: 1.15rem;
      color: #1a1a1a;
    }

    .price-tag {
      background: #e7f1ff;
      color: var(--primary-color);
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .card-body {
      padding: 15px 20px;
    }

    .card-body p {
      color: #444;
      margin-bottom: 15px;
      white-space: pre-line;
    }

    .media-container {
      width: 100%;
      max-height: 420px;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .media-container img,
    .media-container video {
      width: 100%;
      max-height: 420px;
      object-fit: contain;
    }

    /* SOCIAL INTERACTION BAR */
    .social-stats {
      padding: 8px 20px;
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-bottom: 1px solid #f0f0f0;
    }

    .social-actions {
      display: flex;
      justify-content: space-around;
      padding: 6px 10px;
      border-bottom: 1px solid #f0f0f0;
    }

    .btn-action {
      flex: 1;
      background: none;
      border: none;
      padding: 8px 0;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      color: #555;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s, color 0.2s;
    }

    .btn-action:hover {
      background: #f2f2f2;
    }

    .btn-action.liked {
      color: #1877f2;
    }

    /* COMMENTS SECTION */
    .comments-section {
      padding: 15px 20px;
      background: #fafafa;
      display: none;
    }

    .comments-section.active {
      display: block;
    }

    .comments-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 15px;
      max-height: 250px;
      overflow-y: auto;
    }

    .comment-item {
      background: white;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid #eee;
      font-size: 0.9rem;
    }

    .comment-item strong {
      color: #1e3c72;
      display: block;
      font-size: 0.8rem;
    }

    .comment-input-box {
      display: flex;
      gap: 8px;
    }

    .comment-input-box input {
      flex: 1;
      padding: 8px 15px;
      border: 1px solid #ccc;
      border-radius: 20px;
      outline: none;
      font-size: 0.9rem;
    }

    .comment-input-box button {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
    }

    /* MODAL POPUPS */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 15px;
    }

    .modal-content {
      background: white;
      border-radius: var(--radius);
      padding: 25px;
      width: 100%;
      max-width: 450px;
      position: relative;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .close-modal {
      position: absolute;
      top: 12px;
      right: 15px;
      font-size: 1.5rem;
      cursor: pointer;
      color: #888;
    }

    footer {
      text-align: center;
      padding: 20px 15px;
      margin-top: 40px;
      color: var(--text-muted);
      font-size: 0.9rem;
      border-top: 1px solid var(--border-color);
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <nav>
      <h1>Petite Côte Immo</h1>
      <div class="nav-actions">
        <button class="btn-nav" onclick="openModal('modal-courtier')">Créer un compte courtier</button>
        <button class="btn-nav" onclick="openModal('modal-connexion')">Connexion</button>
      </div>
    </nav>
    <div class="hero-banner">
      <h2>Vendre et acheter vos terrains de rêves</h2>
      <p>La plateforme sécurisée de la Petite Côte sénégalaise.</p>
    </div>
  </header>

  <!-- CONTENU PRINCIPAL -->
  <main>

    <!-- FORMULAIRE DE PUBLICATION -->
    <section class="publish-card">
      <h3>➕ Publier un terrain à vendre</h3>
      <form id="form-publier" onsubmit="handlePublish(event)">
        <div class="form-group">
          <input type="text" id="terrain-titre" class="form-control" placeholder="Titre (ex: Terrain 500m² à Saly)" required />
        </div>
        <div class="form-group">
          <input type="number" id="terrain-prix" class="form-control" placeholder="Prix en FCFA (ex: 15000000)" required />
        </div>
        <div class="form-group">
          <textarea id="terrain-desc" class="form-control" placeholder="Description du terrain (Emplacement, viabilisation, titre foncier...)" required></textarea>
        </div>

        <!-- INPUTS FICHIERS CACHÉS -->
        <input type="file" id="input-image" accept="image/*" style="display: none;" onchange="handleFileSelect(event, 'image')" />
        <input type="file" id="input-video" accept="video/*" style="display: none;" onchange="handleFileSelect(event, 'video')" />

        <!-- BOUTONS POUR OUVRIR LA GALERIE / FICHIERS -->
        <div class="media-buttons">
          <button type="button" class="btn-media" onclick="document.getElementById('input-image').click()">
            🖼️ Choisir une Image
          </button>
          <button type="button" class="btn-media" onclick="document.getElementById('input-video').click()">
            🎥 Choisir une Vidéo
          </button>
        </div>

        <!-- PRÉVISUALISATION -->
        <div id="preview-grid" class="preview-grid"></div>

        <button type="submit" class="btn-submit">Publier le terrain</button>
      </form>
    </section>

    <!-- FLUX DES PUBLICATIONS -->
    <h3 class="section-title">Terrains récents à vendre</h3>
    <div id="feed-container">
      <!-- Les publications dynamiques s'afficheront ici -->
    </div>

  </main>

  <!-- MODAL: CREER COMPTE COURTIER -->
  <div id="modal-courtier" class="modal">
    <div class="modal-content">
      <span class="close-modal" onclick="closeModal('modal-courtier')">&times;</span>
      <h3 style="margin-bottom: 15px;">Créer un compte courtier</h3>
      <form onsubmit="alert('Compte courtier créé avec succès !'); closeModal('modal-courtier'); return false;">
        <div class="form-group">
          <input type="text" class="form-control" placeholder="Nom complet" required />
        </div>
        <div class="form-group">
          <input type="tel" class="form-control" placeholder="Numéro Téléphone / WhatsApp" required />
        </div>
        <div class="form-group">
          <input type="password" class="form-control" placeholder="Mot de passe" required />
        </div>
        <button type="submit" class="btn-submit">S'inscrire</button>
      </form>
    </div>
  </div>

  <!-- MODAL: CONNEXION -->
  <div id="modal-connexion" class="modal">
    <div class="modal-content">
      <span class="close-modal" onclick="closeModal('modal-connexion')">&times;</span>
      <h3 style="margin-bottom: 15px;">Connexion</h3>
      <form onsubmit="alert('Connexion réussie !'); closeModal('modal-connexion'); return false;">
        <div class="form-group">
          <input type="tel" class="form-control" placeholder="Numéro Téléphone" required />
        </div>
        <div class="form-group">
          <input type="password" class="form-control" placeholder="Mot de passe" required />
        </div>
        <button type="submit" class="btn-submit">Se connecter</button>
      </form>
    </div>
  </div>

  <!-- FOOTER -->
  <footer>
    <p>Petite Côte Immo - site créé par Ndiome pro le spécialiste</p>
  </footer>

  <!-- JAVASCRIPT SYSTEM -->
  <script>
    let selectedMedia = { type: null, url: null };
    
    let posts = [
      {
        id: 1,
        titre: "Magnifique Terrain 300m² à Nianing",
        prix: "12 500 000 FCFA",
        desc: "Superbe terrain situé à 5 minutes de la plage de Nianing. Zone habitée, électricité et eau disponibles. Titre d'occupation disponible.",
        mediaType: "image",
        mediaUrl: "https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1000&q=80",
        likes: 12,
        isLiked: false,
        comments: [
          { author: "Moussa", text: "Le terrain est toujours disponible ?" },
          { author: "Petite Côte Immo", text: "Oui toujours disponible !" }
        ]
      },
      {
        id: 2,
        titre: "Lot de 2 Terrains Viabilisés à Somone",
        prix: "28 000 000 FCFA",
        desc: "Opportunité unique à La Somone. Proche des commerces et des accès routiers.",
        mediaType: "image",
        mediaUrl: "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1000&q=80",
        likes: 25,
        isLiked: false,
        comments: []
      }
    ];

    document.addEventListener("DOMContentLoaded", () => {
      renderFeed();
    });

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function handleFileSelect(event, type) {
      const file = event.target.files[0];
      if (!file) return;

      const previewGrid = document.getElementById("preview-grid");
      previewGrid.innerHTML = "";

      const objectUrl = URL.createObjectURL(file);
      selectedMedia = { type: type, url: objectUrl };

      const itemDiv = document.createElement("div");
      itemDiv.className = "preview-item";

      if (type === 'image') {
        itemDiv.innerHTML = `<img src="${objectUrl}" alt="Preview" />`;
      } else {
        itemDiv.innerHTML = `<video src="${objectUrl}" controls></video>`;
      }

      previewGrid.appendChild(itemDiv);
    }

    function handlePublish(event) {
      event.preventDefault();

      const titre = document.getElementById("terrain-titre").value;
      const prixVal = document.getElementById("terrain-prix").value;
      const desc = document.getElementById("terrain-desc").value;

      const newPost = {
        id: Date.now(),
        titre: titre,
        prix: parseInt(prixVal).toLocaleString('fr-FR') + " FCFA",
        desc: desc,
        mediaType: selectedMedia.type,
        mediaUrl: selectedMedia.url,
        likes: 0,
        isLiked: false,
        comments: []
      };

      posts.unshift(newPost);

      document.getElementById("form-publier").reset();
      document.getElementById("preview-grid").innerHTML = "";
      selectedMedia = { type: null, url: null };

      renderFeed();
      alert("Votre terrain a été publié avec succès !");
    }

    function renderFeed() {
      const container = document.getElementById("feed-container");
      container.innerHTML = "";

      posts.forEach(post => {
        const card = document.createElement("article");
        card.className = "terrain-card";

        let mediaHtml = "";
        if (post.mediaUrl) {
          if (post.mediaType === "image") {
            mediaHtml = `<div class="media-container"><img src="${post.mediaUrl}" alt="Photo terrain"></div>`;
          } else if (post.mediaType === "video") {
            mediaHtml = `<div class="media-container"><video src="${post.mediaUrl}" controls></video></div>`;
          }
        }

        let commentsListHtml = post.comments.map(c => 
          `<div class="comment-item"><strong>${c.author}</strong>${c.text}</div>`
        ).join("");

        card.innerHTML = `
          <div class="card-header">
            <h4>${post.titre}</h4>
            <span class="price-tag">${post.prix}</span>
          </div>
          <div class="card-body">
            <p>${post.desc}</p>
          </div>
          ${mediaHtml}
          
          <div class="social-stats">
            <span>👍 <span id="likes-count-${post.id}">${post.likes}</span> personnes aiment</span>
            <span>💬 <span id="comments-count-${post.id}">${post.comments.length}</span> commentaires</span>
          </div>

          <div class="social-actions">
            <button class="btn-action ${post.isLiked ? 'liked' : ''}" onclick="toggleLike(${post.id})">
              👍 <span>${post.isLiked ? "J'aime déjà" : "J'aime"}</span>
            </button>
            <button class="btn-action" onclick="toggleCommentsSection(${post.id})">
              💬 <span>Commenter</span>
            </button>
            <button class="btn-action" onclick="sharePost('${post.titre}')">
              ↪️ <span>Partager</span>
            </button>
          </div>

          <div class="comments-section" id="comments-section-${post.id}">
            <div class="comments-list" id="comments-list-${post.id}">
              ${commentsListHtml}
            </div>
            <div class="comment-input-box">
              <input type="text" id="comment-input-${post.id}" placeholder="Écrire un commentaire..." onkeypress="handleCommentKeyPress(event, ${post.id})">
              <button onclick="addComment(${post.id})">Envoyer</button>
            </div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    function toggleLike(postId) {
      const post = posts.find(p => p.id === postId);
      if (!post) return;

      post.isLiked = !post.isLiked;
      post.likes += post.isLiked ? 1 : -1;

      renderFeed();
    }

    function toggleCommentsSection(postId) {
      const section = document.getElementById(`comments-section-${postId}`);
      if (section) {
        section.classList.toggle("active");
      }
    }

    function addComment(postId) {
      const input = document.getElementById(`comment-input-${postId}`);
      const text = input.value.trim();
      if (!text) return;

      const post = posts.find(p => p.id === postId);
      if (post) {
        post.comments.push({ author: "Visiteur", text: text });
        renderFeed();
        setTimeout(() => {
          const section = document.getElementById(`comments-section-${postId}`);
          if (section) section.classList.add("active");
        }, 50);
      }
    }

    function handleCommentKeyPress(event, postId) {
      if (event.key === "Enter") {
        addComment(postId);
      }
    }

    function sharePost(titre) {
      const shareData = {
        title: titre,
        text: `Découvrez cette annonce sur Petite Côte Immo : ${titre}`,
        url: window.location.href
      };

      if (navigator.share) {
        navigator.share(shareData).catch(() => {});
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert("Lien de la publication copié dans le presse-papier !");
      }
    }
  </script>
</body>
</html>
